# Games API: leaderboards for every game on the site (Cloudflare Worker + D1). Deploy from this folder:
#   npm test && npx wrangler deploy
# The Worker keeps its first name, bitflip-leaderboard, so its URL (params.toml [games] api) stays the same.
# Secrets (not in this file): ADMIN_KEY (admin page), HASH_SALT (salts the IP hash used for rate limiting).
name = "bitflip-leaderboard"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Pages allowed to call the API from a browser.
ALLOWED_ORIGINS = "https://peilong.github.io,http://localhost:1313"

# Code Word's guess dictionary (data/words.txt) is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "bitflip"
database_id = "2ff1c0ce-865c-47f6-9800-db07bbc43169"

# Daily cleanup of old game records (07:17 UTC).
[triggers]
crons = ["17 7 * * *"]
