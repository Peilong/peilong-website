{{- define "main" -}}
{{/* Site override of the theme's _default/single.html for blog posts: adds the newsletter signup after the article. */}}

<article class="article">

  {{ partial "page_header" . }}

  <div class="article-container">

    <div class="article-style">
      {{ .Content }}
    </div>

    {{ partial "newsletter_signup" (dict "id" "post") }}

    {{ partial "page_footer" . }}

  </div>
</article>

{{- end -}}
