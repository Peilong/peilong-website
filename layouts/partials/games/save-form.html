{{- /* Name form under a daily result (behavior: GamesShared.nameForm). Context: the input's id prefix (string). */ -}}
<form class="g-save" data-save hidden novalidate>
  <label class="g-save-label" for="{{ . }}-name">Put your result on today&rsquo;s board</label>
  <div class="g-save-row">
    <input id="{{ . }}-name" data-name type="text" maxlength="16" autocomplete="nickname" autocapitalize="words"
           spellcheck="false" enterkeyhint="done" placeholder="Your name">
    <button type="submit" class="g-btn g-btn-small" data-save-btn>Save</button>
  </div>
  <p class="g-save-msg" data-save-msg aria-live="polite"></p>
</form>
<p class="g-save-note" data-save-note hidden></p>
