{{/* Site override (theme hook: partials/custom_head.html). Styles for the dark-mode navbar, the newsletter signup box and the footer visitor map. */}}
<style>
  /* Dark-mode top menu bar. Academic 4.6 only swaps the navbar's shadow in dark mode, so the bar stayed white.
     Bar = a shade deeper than the dark page (#282a36) with a hairline edge, mirroring the white bar + shadow in day
     mode. Active tab = #82b1ff, the light member of the day theme's Material blue (#2962ff), which is too dark to
     read on a dark bar. #navbar-main + body.dark out-rank the theme's id-level and !important menu rules. */
  #navbar-main { transition: background-color .2s ease, box-shadow .2s ease; }
  body.dark #navbar-main,
  body.dark #navbar-main .navbar-collapse { background-color: #21222c; }
  body.dark #navbar-main { box-shadow: 0 1px 0 rgba(255,255,255,.08), 0 .125rem .5rem rgba(0,0,0,.35); }
  body.dark #navbar-main .navbar-brand,
  body.dark #navbar-main .navbar-brand:hover,
  body.dark #navbar-main .navbar-brand:focus { color: #f8f8f2; }
  body.dark #navbar-main .navbar-nav .nav-link,
  body.dark #navbar-main .navbar-toggler { color: rgba(248,248,242,.78); }
  body.dark #navbar-main .navbar-nav .nav-link:hover,
  body.dark #navbar-main .navbar-nav .nav-link:focus,
  body.dark #navbar-main .navbar-toggler:hover { color: #fff; }
  body.dark #navbar-main .navbar-nav .nav-link.active { color: #82b1ff !important; }
  body.dark #navbar-main .dropdown-menu,
  body.dark #navbar-main .dropdown-item { background-color: #21222c !important; color: rgba(248,248,242,.85) !important; }
  body.dark #navbar-main .dropdown-menu { border-color: rgba(255,255,255,.12); }
  body.dark #navbar-main .dropdown-item:hover,
  body.dark #navbar-main .dropdown-item:focus { background-color: #2c2e3b !important; color: #fff !important; }
  body.dark #navbar-main .dropdown-item.active,
  body.dark #navbar-main .i18n-active { color: #82b1ff !important; }

  .newsletter-signup { margin: 2.5rem 0 1.5rem; padding: 1.25rem 1.5rem; border: 1px solid rgba(0,0,0,.12); border-radius: .5rem; background: rgba(0,0,0,.025); }
  body.dark .newsletter-signup { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.04); }
  .newsletter-signup .newsletter-title { margin: 0 0 .35rem; font-size: 1.2rem; }
  .newsletter-signup .newsletter-blurb { font-size: .95rem; margin-bottom: .75rem; }
  .newsletter-signup .btn-primary { color: #fff; }
  .newsletter-signup .newsletter-note { font-size: .8rem; margin: .6rem 0 0; opacity: .8; }
  /* Footer visitor map (layouts/partials/visitor_map.html). The widget draws on a fixed navy (#1C3352) panel, so
     the rounded card looks the same in day and night mode. */
  .visitor-map { margin: 0 auto 1.5rem; text-align: center; }
  .visitor-map .visitor-map-title { margin: 0 0 .5rem; font-size: .75rem; letter-spacing: .02em; opacity: .75; }
  .visitor-map .visitor-map-card { display: inline-block; position: relative; border-radius: .75rem; overflow: hidden;
    background: #1c3352; box-shadow: 0 1px 3px rgba(28,51,82,.25); line-height: 0; }
  .visitor-map #mapmyvisitors-widget { border: 0 !important; }
  /* Hide the dead +/- zoom buttons baked into the widget's background image (bottom-left corner). */
  .visitor-map .visitor-map-card::after { content: ""; position: absolute; left: 0; bottom: 0; width: 24px; height: 48px;
    background: #1c3352; pointer-events: none; z-index: 2; }
</style>
